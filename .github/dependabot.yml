version: 2

# @rmartz/repo-hygiene is an npm dependency published to GitHub Packages, so
# Dependabot needs registry auth to see new versions of it. Without this block it
# resolves only the public-npm deps and silently never opens a PR for the @rmartz
# scope — which is how this repo sat on repo-hygiene 1.0.0 while the CLI reached
# 7.0.1. The DEPENDABOT_PACKAGES_TOKEN Dependabot secret (a classic PAT with
# `read:packages`) already exists on this repo; it was simply never wired up.
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: npm
    # pnpm workspace: scan the ROOT only. Dependabot reads pnpm-workspace.yaml from
    # the root and updates every workspace package's manifest together with the
    # single root pnpm-lock.yaml. Do NOT add '/packages/*': each listed directory runs
    # its own update job, and a job rooted in a package directory has no lockfile in
    # scope, so it edits package.json alone and every CI job fails
    # `pnpm install --frozen-lockfile` (e.g. #336 vs the root-job #308 for the same bump).
    directory: /
    # Grants this ecosystem access to the GitHub Packages registry declared above.
    registries:
      - github-packages
    schedule:
      interval: weekly
    # Let new third-party releases age 7 days before opening update PRs, reducing
    # exposure to supply-chain attacks where a malicious version is published then
    # yanked. First-party `@rmartz/*` packages are exempt: they're published from
    # our own repos with provenance, so the wait adds no protection and only holds
    # our own fixes back.
    cooldown:
      default-days: 7
      exclude:
        - '@rmartz/*'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      # `typescript` and `tsup` are declared in EVERY workspace manifest. Each is
      # isolated in its own group so every one of its bumps — major, minor, and patch —
      # lands in a single dedicated PR that moves every package in lockstep, separate
      # from unrelated dev-dep bumps:
      #   - typescript: a minor can shift type inference and fail the typecheck, so
      #     (like prettier) its bumps are reviewed on their own.
      #   - tsup: a bundler major can change build output across every package.
      # No `update-types` filter: an isolated group keeps all of its dependency's bumps
      # together rather than splitting some into the catch-all.
      # Listed first to win group-assignment precedence (each dependency joins the first
      # group whose patterns match).
      typescript:
        patterns:
          - 'typescript'
      tsup:
        patterns:
          - 'tsup'
      # CI-sensitive tools in one group: pr-policy requires a `ci` title for any
      # eslint/prettier version change (the formatter/linter can fail files a PR never
      # touched — a prettier bump can reformat the whole codebase), so they must not
      # ride in a catch-all where they would block every routine bump. Plugins and
      # configs move in lockstep with their tool: `@typescript-eslint/eslint-plugin`
      # and `@typescript-eslint/parser` ship on an IDENTICAL version line, and the
      # eslint plugins and import resolver track eslint's major. No `update-types`
      # filter, so a major brings its family with it and a minor/patch never falls
      # through to the `dev-dependencies` catch-all.
      ci:
        patterns:
          - 'eslint'
          - '@typescript-eslint/*'
          - 'eslint-plugin-*'
          - 'eslint-import-resolver-*'
          - 'prettier'
      # Everything else: group only minor/patch bumps. Major bumps fall outside the
      # groups and get individual PRs, since they are more likely to need code
      # changes and are better reviewed in isolation.
      dev-dependencies:
        dependency-type: development
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
      production-dependencies:
        dependency-type: production
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new third-party releases age 7 days before opening update PRs, reducing
    # exposure to supply-chain attacks where a malicious version is published then
    # yanked. First-party `rmartz/*` actions and reusable workflows are exempt:
    # they're published from our own repos, so the wait only holds our fixes back.
    cooldown:
      default-days: 7
      exclude:
        - 'rmartz/*'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # Group minor/patch GitHub Actions updates together. Major bumps fall outside the
    # group and get individual PRs, so a pending major never holds routine bumps back.
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
