name: 'Setup'
description: 'Install pnpm, Node.js, and project dependencies'

inputs:
  frozen-lockfile:
    description: 'Use --frozen-lockfile for pnpm install'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # pnpm version comes from packageManager in package.json
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24.x
        cache: 'pnpm'
    # @rmartz/repo-hygiene is consumed from GitHub Packages (see the repo .npmrc's
    # scoped registry). GitHub Packages requires a token even for public packages,
    # so write the job's built-in GITHUB_TOKEN as the @rmartz-scope auth before
    # install. Needs `packages: read` on the calling workflow.
    - name: Authenticate to GitHub Packages (@rmartz scope)
      shell: bash
      run: printf '//npm.pkg.github.com/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" >> ~/.npmrc
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
    - run: pnpm install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '--no-frozen-lockfile' }}
      shell: bash
