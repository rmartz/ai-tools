name: bot-automerge

# Enables GitHub-native auto-merge for trustworthy bot PRs by calling the
# rmartz/bot-automerge-action composite Action (SHA-pinned, Dependabot-bumped).
# Two consumers in this repo:
#   - release-please release PRs → hands-off continuous delivery (#236): the
#     release PR auto-merges once its required checks are green.
#   - green Dependabot patch/minor bumps → auto-merge (majors stay manual).
#
# Both paths enable auto-merge with an installation token for the rmartz-merge-bot
# GitHub App — never GITHUB_TOKEN. GitHub fires no `push` workflows for a merge
# whose auto-merge was enabled with GITHUB_TOKEN, so release.yml (`on: push`) would
# never re-fire and nothing would publish (rmartz/bot-automerge#8,
# rmartz/bot-automerge-action#31). App-authored events do trigger workflows, and
# the App draws on its own rate-limit pool rather than the user's, so a coordinator
# run that exhausts the user's GraphQL quota cannot fail this job
# (rmartz/scripts#22). A composite action cannot `secrets: inherit`, so the token
# is passed as the explicit `token` input.
#
# The reusable workflow's per-PR `concurrency` group is deliberately absent. GitHub
# permits only one PENDING run per group and cancels any it supersedes, so a burst
# of pull_request_target events (opening a PR and labelling it fires one each) left
# `cancelled` check-runs on the PR — a conclusion our automation reads as failing.
# Without a group nothing queues, so nothing is cancelled.
#
# Native auto-merge waits on the branch ruleset's required checks (Test / Format /
# Typecheck / Build), so it never merges ahead of CI. `pull_request_target` (not
# `pull_request`) is required so Dependabot's read-only-token PRs get base-context
# write.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  bot-automerge:
    # Skip the job outright on PRs the CLI could never trust, so a human PR shows a
    # free `skipped` instead of installing the CLI just to no-op. The two
    # conditions mirror the CLI's own detectBotPrType exactly — Dependabot by
    # author, release-please by head branch prefix — so nothing eligible is
    # skipped. The `autorelease: pending` label is not a signal: since v2.0.0 the
    # CLI ignores it, because anyone with triage permission can apply it
    # (rmartz/bot-automerge#41).
    #
    # Do NOT collapse this to an author test such as
    # user.login == 'dependabot[bot]'. Release PRs are authored by whichever
    # identity release.yml runs release-please under (now rmartz-merge-bot[bot],
    # previously the real user) — an author-only guard would skip every release PR
    # and silently halt continuous delivery.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      || startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The App's Client ID and private key are stored as both Actions and
      # Dependabot secrets (a Dependabot-triggered run sees only the latter).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.MERGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_BOT_PRIVATE_KEY }}
      - uses: rmartz/bot-automerge-action@503470fb0862b198960b5611c31df240a4adceb6 # v2.2.0
        with:
          pr: ${{ github.event.pull_request.number }}
          token: ${{ steps.app-token.outputs.token }}
