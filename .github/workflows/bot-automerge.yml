name: bot-automerge

# Enables GitHub-native auto-merge for trustworthy bot PRs by calling the
# rmartz/bot-automerge-action composite Action (SHA-pinned, Dependabot-bumped).
# Two consumers in this repo:
#   - release-please release PRs → hands-off continuous delivery (#236): the
#     release PR auto-merges once its required checks are green.
#   - green Dependabot patch/minor bumps → auto-merge (majors stay manual).
#
# Both paths enable auto-merge with BOT_AUTOMERGE_TOKEN, a real-actor PAT — never
# GITHUB_TOKEN. GitHub fires no `push` workflows for a merge whose auto-merge was
# enabled with GITHUB_TOKEN, so release.yml (`on: push`) would never re-fire and
# nothing would publish (rmartz/bot-automerge#8, rmartz/bot-automerge-action#31).
# A composite action cannot `secrets: inherit`, so the PAT is passed as the
# explicit `token` input.
#
# The reusable workflow's per-PR `concurrency` group is deliberately absent. GitHub
# permits only one PENDING run per group and cancels any it supersedes, so a burst
# of pull_request_target events (opening a PR and labelling it fires one each) left
# `cancelled` check-runs on the PR — a conclusion our automation reads as failing.
# Without a group nothing queues, so nothing is cancelled.
#
# Native auto-merge waits on the branch ruleset's required checks (Test / Format /
# Typecheck / Build), so it never merges ahead of CI. `pull_request_target` (not
# `pull_request`) is required so Dependabot's read-only-token PRs get base-context
# write.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  bot-automerge:
    # Skip the job outright on PRs the CLI could never trust, so a human PR shows a
    # free `skipped` instead of installing the CLI just to no-op. The two
    # conditions mirror the CLI's own detectBotPrType exactly — Dependabot by
    # author, release-please by head branch prefix — so nothing eligible is
    # skipped. The `autorelease: pending` label is not a signal: since v2.0.0 the
    # CLI ignores it, because anyone with triage permission can apply it
    # (rmartz/bot-automerge#41).
    #
    # Do NOT collapse this to an author test such as
    # endsWith(user.login, '[bot]'). Because release-please runs here under
    # RELEASE_PLEASE_PAT, its release PRs are authored by that real user (rmartz),
    # not a [bot] account — an author-only guard would skip every release PR and
    # silently halt continuous delivery.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      || startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rmartz/bot-automerge-action@3e26c765f2da6c360fd39ab8aef7a50090a96657 # v2.1.1
        with:
          pr: ${{ github.event.pull_request.number }}
          # Real-actor PAT, stored as both an Actions and a Dependabot secret (a
          # Dependabot-triggered run sees only the latter). When the secret is
          # unset the action falls back to GITHUB_TOKEN itself.
          token: ${{ secrets.BOT_AUTOMERGE_TOKEN }}
