name: merge-safety

# Calls the rmartz/merge-safety reusable workflow: `evaluate` posts the
# `merge-safety` check-run (the coordinator's "must this PR be brought current
# before merge?" verdict) and, via the push fan-out, `invalidate` flips every open
# PR's verdict when the base moves. ai-tools consumes it like any other repo now
# that merge-safety ships from its own repo (extracted from @rmartz/pr-review, #247);
# the reusable workflow is SHA-pinned with a version comment so Dependabot's
# github-actions ecosystem keeps it current, and the CLI version it installs tracks
# the release in lockstep.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate
        required: true

permissions:
  checks: write # post/flip the merge-safety check-run
  pull-requests: write # reconcile the update-required / merge-conflict labels
  contents: read
  actions: write # dispatch per-PR evaluate runs from the push fan-out
  packages: read # the reusable workflow installs @rmartz/merge-safety from GitHub Packages

jobs:
  merge-safety:
    uses: rmartz/merge-safety/.github/workflows/merge-safety.yml@db145fb8c20164185eb9e1a1c237dc4d9085c69f # v0.1.0
    with:
      pr: ${{ inputs.pr }}
    secrets: inherit
