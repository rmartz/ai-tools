name: Release

# Automated releases via release-please. On every push to main it maintains an
# aggregated "release" PR that bumps the changed packages (from Conventional-
# Commit history) and updates their changelogs. Merging that PR creates the
# releases/tags; the publish job then builds and runs `pnpm -r publish` (which
# skips any version already on the registry), so only the bumped packages ship.
on:
  push:
    branches: [main]

permissions:
  contents: write # create releases + the release-PR branch
  pull-requests: write # open/update the release PR

# Serialize release-please across a burst of main merges: run one at a time rather
# than firing several concurrent, API-heavy invocations that can exhaust the
# token's REST rate limit (observed 2026-07-10, under the former user PAT — three
# merges in ~6 min failed the third with "API rate limit already exceeded"). Queue rather
# than cancel: every merge must still be reconciled into the aggregated release PR.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # GITHUB_TOKEN-created PRs don't trigger CI, so release-please runs under an
      # installation token for the rmartz-merge-bot GitHub App: App-authored
      # release PRs run CI, and the App's rate-limit pool is separate from the
      # user's (rmartz/scripts#22).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.MERGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to publish to GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rmartz'

      # The install now resolves @rmartz/repo-hygiene from GitHub Packages (an
      # external devDependency), so the @rmartz-scope auth token must be present
      # here, not only on the publish step below.
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm run build

      - name: Publish to GitHub Packages
        run: pnpm -r publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
